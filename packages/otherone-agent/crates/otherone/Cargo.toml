[package]
name = "otherone"
version = "0.6.0-yrkie.1"
edition = "2021"
license = "MIT"
readme = "../../README.md"
documentation = "https://docs.rs/otherone"
repository = "https://github.com/wuyoujae/otherone-agent"
keywords = ["ai", "agent", "llm", "mcp", "skills"]
categories = ["api-bindings", "asynchronous"]
description = "otherone — 轻量级、可扩展的 Rust AI Agent 框架"

[features]
default = ["localfile", "postgres"]
localfile = [
    "otherone-agent/localfile",
    "otherone-context/localfile",
    "otherone-storage/localfile",
]
postgres = [
    "otherone-agent/postgres",
    "otherone-context/postgres",
    "otherone-storage/postgres",
]

[dependencies]
otherone-ai = { version = "0.6.0", path = "../otherone-ai" }
otherone-agent = { version = "0.6.0-yrkie.1", path = "../otherone-agent", default-features = false }
otherone-context = { version = "0.6.0-yrkie.1", path = "../otherone-context", default-features = false }
otherone-memory = { version = "0.5.0", path = "../otherone-memory" }
otherone-tools = { version = "0.6.0", path = "../otherone-tools" }
otherone-storage = { version = "0.6.0-yrkie.1", path = "../otherone-storage", default-features = false }
otherone-skills = { version = "0.5.0", path = "../otherone-skills" }
otherone-mcp = { version = "0.6.0", path = "../otherone-mcp" }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
