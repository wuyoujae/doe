    <style>
      .schema-slide[data-export-snapshot="true"][data-overflow="true"]::after {
        display: none !important;
      }
      html,
      body {
        width: var(--doe-canvas-width, 1280px);
        height: var(--doe-canvas-height, 720px);
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }

      #export-slide-root,
      #export-slide-root > .schema-slide {
        width: var(--doe-canvas-width, 1280px);
        height: var(--doe-canvas-height, 720px);
        margin: 0;
      }

      #export-slide-root > .schema-slide {
        font-family: var(--font-sans-cn);
        font-synthesis: none;
        -webkit-font-smoothing: auto;
        -moz-osx-font-smoothing: auto;
        text-rendering: optimizeLegibility;
      }
