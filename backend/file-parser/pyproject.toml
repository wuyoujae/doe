[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otherone-file-parser"
version = "0.1.3"
description = "Internal Docling document parsing service for Yrkie"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "defusedxml==0.7.1",
  "docling==2.132.0",
  "fastapi==0.139.0",
  "python-multipart==0.0.32",
  "starlette==1.3.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.3",
  "ruff==0.9.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "docling_smoke: loads the real Docling runtime and models",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
