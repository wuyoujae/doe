[package]
name = "yrkie-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[dependencies]
otherone = { path = "../packages/otherone-agent/crates/otherone", default-features = false, features = ["localfile", "postgres"] }
async-trait = "=0.1.92"
tokio-util = { version = "=0.7.19", features = ["rt"] }
tokio-stream = "=0.1.19"
aes-gcm = "=0.10.3"
axum = { version = "=0.8.9", features = ["json", "multipart"] }
base64 = "=0.22.1"
doe-document = { path = "../packages/doe/packages/doe-document/rust" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "multipart"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "=2.5.8"
uuid = { version = "=1.27.0", features = ["v4"] }
zeroize = "=1.9.0"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

[build-dependencies]
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[lints.clippy]
unwrap_used = "warn"

